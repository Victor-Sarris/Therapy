<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet</title>
    <link rel="stylesheet" href="../../01. Css - Telas de Cadasto - Login/Paciente/tela_meet_paciente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="shortcut icon" href="../../01. and_icons_and_images/therapy_icon/FiveIcon/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo"><img src="../../01. and_icons_and_images/therapy_icon/logo_therapy.png" alt="logo"> <span class="logo-text">Therapy</span></div>
            </div>
            <div class="profile-mini">
                <img src="../../01. and_icons_and_images/img_cliente/cliente.png" alt="Foto do cliente">
                <div class="name"><a href="tela_perfil_cliente.html">Davi Oliveira</a></div>
            </div>
            <nav>  <!-- obs.:sidebar cliente-->
                <ul>
                     <li><a href="#" class="active"><i class="fa-solid fa-user-doctor icon"></i><span class="text">Outros Especialistas</span><span class="tooltip">Outros Especialistas</span></a></li>
                    <li><a href="#" onclick="showMeetPopup()"><i class="fa-solid fa-video icon"></i><span class="text">Meet</span><span class="tooltip">Meet</span></a></li>
                   
                    <li><a href="tela_historico_consultas.html"><i class="fa-solid fa-table-list"></i><span class="text">Histórico de Consultas</span><span class="tooltip">Histórico de Consultas</span></a></li>
                    <li><a href="tela-agenda.html"><i class="fa-solid fa-calendar-days icon"></i><span class="text">Agenda</span><span class="tooltip">Agenda</span></a></li>
                  
                    <li><a href="tela_msg_cliente.html"><i class="fa-solid fa-comments icon"></i><span class="text">Mensagens</span><span class="tooltip">Mensagens</span></a></li>
                    <li><a href="tela_perfil_cliente_edicao.html"><i class="fa-solid fa-gear icon"></i><span class="text">Ajustes</span><span class="tooltip">Ajustes</span></a></li>
                </ul>
            </nav>
            <div class="logout">
                <a href="../tela_de_login.html"><i class="fa-solid fa-arrow-right-from-bracket icon"></i><span class="text">Sair da Conta</span><span class="tooltip">Sair da Conta</span></a>
            </div>
        </aside>


  <main>
    <section class="meet-info">
      <h2>Therapy Meet</h2>
      <p class="date">10 Dez 2024</p>
      <p class="recording">🔴 Gravação 26:32</p>
    </section>

    <div class="video-call">
      <div class="video-container">
        <span class="tag">Psicóloga Clarice</span>
        <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e" alt="Psicóloga em chamada" />
      </div>
      <div class="controls">
        <button title="Desligar câmera"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828859.png" /></button>
        <button title="Mutar microfone"><img src="https://cdn-icons-png.flaticon.com/512/753/753345.png" /></button>
        <button class="end-call">Sair da Chamada</button>
        <button title="Compartilhar tela"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828961.png" /></button>
        <button title="Legenda oculta"><img src="https://cdn-icons-png.flaticon.com/512/753/753318.png" /></button>
      </div>

      <div class="user-avatar">
        <img src="../../01. and_icons_and_images/img_cliente/cliente.png" alt="Você" />
        <span>Você</span>
      </div>
    </div>
  </main>

    <script src="../../01. JS - Telas de cadastro/Paciente/tela_meet_paciente.js"></script>
</body>
</html>
