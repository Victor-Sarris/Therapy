<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Psicólogo</title>
    <link rel="stylesheet" href="./tela_cadastro_psicologo.css/psicologo_cadastro.css">
</head>
<body>
    <header class="navbar"> <!--código da navbar-->
        <div class="logo"><img src="tela_de_cadastro.css/img/logo_therapy.png" alt="">Therapy</div>
        <nav>
            <ul>
            <li><a href="#" id="Home">Home</a></li>
            <li><a href="#">Atendimento</a></li>
            <li><a href="#">Especialistas</a></li>
            <li><a href="#">Sobre Nós</a></li>
            </ul>
        </nav>
    </header>
    <section class="section.form">
        <div class="flex" id="texto-alinhados">
        <div class="container" id="filha01">
            <h1>Preencha o formulário abaixo</h1>
        </div>
        <div class="box">
            <div class="flex">
                <div class="container">
                    <h2>Sobre você</h2>
                    <form action="">
                        <div class="form-group">
                            <input type="text" placeholder=" " id="nome" required>
                            <label for="nome">Nome</label>
                        </div>

                        <div class="form-group">
                            <input type="email" placeholder=" " id="email" required>
                            <label for="email">Email</label>
                        </div>

                        <div class="form-group">
                            <input type="password" placeholder=" " id="senha" required>
                            <label for="senha">Senha</label>
                        </div>

                        <div class="telefone-cpf">
                            <div class="form-group">
                                <input type="text" name="telefone"
                                id="telefone"
                                placeholder=" " required>
                                <label for="telefone">Telefone</label>
                            </div>
                            <div class="form-group">
                                <input type="text" id="cpf" placeholder=" " required>
                                <label for="cpf">CPF</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <select id="genero" required>
                                <option value="" disabled selected hidden></option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                            </select>
                            <label for="genero">Gênero</label>
                        </div>
                    </form>
                </div>

                <div class="container">
                    <h2>Sua Especialidade</h2>
                    <form action="">
                        <div class="checkbox-group">
                            <div>
                                <input type="checkbox" id="psicologo">
                                <label for="psicologo">Psicólogo(a)</label>
                            </div>
                            <div>
                                <input type="checkbox" id="psicanalista">
                                <label for="psicanalista">Psicanalista</label>
                            </div>
                            <div>
                                <input type="checkbox" id="terapeuta">
                                <label for="terapeuta">Terapeuta</label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <input type="text" name="crp" id="crp" placeholder=" " required>
                            <label for="crp">CRP</label>
                        </div>

                        <div class="form-group">
                            <input type="text" name="abordagem" id="abordagem" placeholder=" " required>
                            <label for="abordagem">Abordagem</label>
                        </div>

                        <div class="form-group">
                            <input type="text" name="descricao" id="descricao" placeholder=" " required>
                            <label for="descricao">Descrição</label>
                        </div>

                        <div class="form-footer">
                            <input type="checkbox" id="termos" name="termos" required>
                            <label for="termos">
                            Você concorda com nossos termos de <a href="#">privacidade</a> e <a href="#">política</a>
                            </label>
                        </div>
                    </form>
                </div>
            </div>
            <button type="submit" class="submit-btn">Enviar Cadastro</button>
        </div>
        </div>


    </section>
</body>
</html>
