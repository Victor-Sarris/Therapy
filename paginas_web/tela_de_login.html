<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="tela_de_login.css/style.css">
  <link rel="shortcut icon" href="midia/FiveIcon/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="navbar"> <!--código da navbar-->
    <div class="logo"><img src="midia/logo_therapy.png" alt="Logo Therapy">Therapy</div>
    <nav>
      <ul>
        <li><a href="#" id="Home">Home</a></li>
        <li><a href="#">Atendimento</a></li>
        <li><a href="#">Especialistas</a></li>
        <li><a href="https://linkbio.co/therapy"  target="_blank" rel="external">Sobre Nós</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="login-box">
      <h2>Acesse sua conta!</h2>
      <div class="role-selector">
        <label><input type="radio" name="role" checked> <span>Psicólogo(a</span>)</label>
        <label><input type="radio" name="role"> <span>Paciente</span></label>
      </div>
      <form>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p class="signup-link">Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </main>
</body>
</html>
